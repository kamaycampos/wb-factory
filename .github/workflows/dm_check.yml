# DM CHECK (12 Nov 2026): what the EBOOK comment bot would do right now. Reads only, sends nothing.
name: dm-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DM_AUTO: "on"
      DM_DIAG: "1"
      KT_CTA_KEYWORDS: "EBOOK"
      OFFER_URL: "https://herpescurebook.com/?ref=a43c8j"
      DM_TEXT: "Hey! Thanks for commenting. Here is the free ebook, what Kevin Trudeau found in his research on herpes: {link}"
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: DM_RECENT_POSTS=8 python dm/dm_reply.py --dry
